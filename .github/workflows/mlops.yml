name: MLOps Pipeline

on:
  push:
    branches: [main]
    paths:
      - 'data/**.dvc'
      - 'src/**.py'
      - 'params.yaml'
  workflow_dispatch:

env:
  AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
  AWS_DEFAULT_REGION: ${{ secrets.AWS_REGION }}
  S3_BUCKET: ${{ secrets.S3_BUCKET }}

jobs:

  test:
    name: Unit Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install dependencies
        run: pip install -r requirements.txt && pip install dvc-s3 boto3
      - name: Run unit tests
        run: pytest tests/ -v


  train:
    name: Train
    needs: test
    runs-on: ubuntu-latest
    outputs:
      accuracy: ${{ steps.read_metrics.outputs.accuracy }}

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install dependencies
        run: pip install -r requirements.txt && pip install dvc-s3 boto3
      - name: Configure AWS credentials
        run: |
          mkdir -p ~/.aws
          echo "[default]" > ~/.aws/credentials
          echo "aws_access_key_id = ${{ env.AWS_ACCESS_KEY_ID }}" >> ~/.aws/credentials
          echo "aws_secret_access_key = ${{ env.AWS_SECRET_ACCESS_KEY }}" >> ~/.aws/credentials
          echo "region = ${{ env.AWS_DEFAULT_REGION }}" >> ~/.aws/credentials
      - name: Pull data with DVC
        run: dvc pull data/train_phase1.csv data/eval.csv
      - name: Train model
        run: python src/train.py
      - name: Read metrics
        id: read_metrics
        run: |
          ACC=$(python -c "import json; d=json.load(open('outputs/metrics.json')); print(d['accuracy'])")
          echo "accuracy=$ACC" >> $GITHUB_OUTPUT
      - name: Upload model to S3
        run: |
          python -c "
          import boto3, os
          s3 = boto3.client('s3',
              aws_access_key_id=os.environ['AWS_ACCESS_KEY_ID'],
              aws_secret_access_key=os.environ['AWS_SECRET_ACCESS_KEY'],
              region_name=os.environ['AWS_DEFAULT_REGION'])
          bucket = os.environ['S3_BUCKET']
          s3.upload_file('models/model.pkl', bucket, 'models/latest/model.pkl')
          print(f'Model uploaded to s3://{bucket}/models/latest/model.pkl')
          "
      - name: Save metrics as artifact
        uses: actions/upload-artifact@v4
        with:
          name: metrics
          path: outputs/metrics.json


  eval:
    name: Eval
    needs: train
    runs-on: ubuntu-latest
    steps:
      - name: Check eval gate
        run: |
          python -c "
          acc = float('${{ needs.train.outputs.accuracy }}')
          print(f'Accuracy: {acc:.4f}')
          if acc < 0.70:
              raise SystemExit(f'FAILED: accuracy {acc:.4f} < 0.70')
          print(f'PASSED: accuracy >= 0.70. Dang trien khai model.')
          "


  deploy:
    name: Deploy
    needs: eval
    runs-on: ubuntu-latest
    steps:
      - name: Configure AWS credentials
        run: |
          mkdir -p ~/.aws
          echo "[default]" > ~/.aws/credentials
          echo "aws_access_key_id = ${{ env.AWS_ACCESS_KEY_ID }}" >> ~/.aws/credentials
          echo "aws_secret_access_key = ${{ env.AWS_SECRET_ACCESS_KEY }}" >> ~/.aws/credentials
          echo "region = ${{ env.AWS_DEFAULT_REGION }}" >> ~/.aws/credentials

      - name: SSH deploy to EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          timeout: 5m
          script: |
            set -e
            sudo systemctl stop mlops-serve || true
            mkdir -p ~/models ~/src
            pip install boto3 -q
            python3 -c "
            import boto3, os
            s3 = boto3.client('s3',
                aws_access_key_id='${{ env.AWS_ACCESS_KEY_ID }}',
                aws_secret_access_key='${{ env.AWS_SECRET_ACCESS_KEY }}',
                region_name='${{ env.AWS_DEFAULT_REGION }}')
            s3.download_file('${{ env.S3_BUCKET }}', 'models/latest/model.pkl', '/root/models/model.pkl')
            print('Model downloaded from S3')
            "
            sudo systemctl start mlops-serve
            sleep 10
            for i in 1 2 3 4 5; do
              curl -sf http://localhost:8000/health && echo "OK" && exit 0
              sleep 5
            done
            exit 1
